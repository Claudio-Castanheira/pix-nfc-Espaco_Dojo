<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061b4f">
<title>Constantino Jiu-Jitsu | Pix</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --navy:#061b4f;
  --navy2:#0a286b;
  --gold:#d6a62a;
  --gold2:#f0c34b;
  --white:#fff;
  --muted:#d9e1f2;
  --line:rgba(255,255,255,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% -10%,#163b83 0,#0a286b 32%,#061b4f 72%);
  min-height:100vh;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.08;
  background:
    repeating-linear-gradient(135deg,transparent 0 18px,#fff 19px 20px);
}
.page{max-width:980px;margin:auto;padding:18px 14px 28px;position:relative}
.hero{text-align:center;padding:10px 10px 22px}
.logo{
  width:150px;height:150px;border-radius:50%;
  object-fit:cover;
  border:5px solid var(--gold);
  box-shadow:0 0 0 4px #fff,0 10px 30px rgba(0,0,0,.35);
}
h1{
  margin:18px 0 6px;
  font-size:clamp(27px,5vw,48px);
  letter-spacing:2px;
  font-weight:900;
}
.tagline{
  color:var(--gold2);
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  font-size:clamp(12px,2.5vw,19px);
}
.panel{
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin:12px 0;
  background:rgba(3,20,59,.58);
  box-shadow:0 10px 28px rgba(0,0,0,.15);
}
.section-title{
  font-size:clamp(22px,4vw,34px);
  font-weight:900;
  margin:0 0 6px;
}
.section-subtitle{font-size:17px;color:var(--muted);margin-bottom:18px}
.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.product{
  appearance:none;
  border:2px solid var(--gold);
  border-radius:16px;
  background:#fff;
  color:#071b4f;
  padding:18px 12px;
  min-height:205px;
  cursor:pointer;
  transition:.18s transform,.18s box-shadow;
  font-weight:700;
}
.product:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.25)}
.product:active{transform:scale(.98)}
.product-icon{font-size:58px;display:block;margin-bottom:8px}
.product-name{font-size:24px;font-weight:900;display:block}
.product-price{
  display:block;
  border-top:2px solid var(--gold);
  margin:10px auto 0;
  padding-top:10px;
  font-size:27px;
  font-weight:900;
}
.hint{text-align:center;color:var(--muted);margin:18px 0 0}
.hidden{display:none!important}
.confirm-row{
  border:1px solid var(--gold);
  border-radius:15px;
  padding:16px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  align-items:center;
}
.confirm-cell{text-align:center}
.confirm-label{font-size:14px;color:var(--muted)}
.confirm-value{font-size:24px;font-weight:900;margin-top:4px}
.confirm-price{font-size:34px;color:var(--gold2);font-weight:900}
.message{font-size:18px;line-height:1.45}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
button.action{
  border-radius:13px;
  padding:16px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  border:2px solid var(--gold);
}
.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#071b4f}
.secondary{background:transparent;color:#fff}
.payment-grid{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:24px;
  align-items:center;
}
.qr-wrap{background:#fff;border-radius:14px;padding:15px;width:max-content;margin:auto}
#qrcode{display:flex;justify-content:center}
#qrcode img{display:block}
.pay-note{font-size:18px;line-height:1.45}
.pix-title{color:var(--gold2);font-size:18px;font-weight:900;border-top:2px solid var(--gold);padding-top:10px;margin-top:14px}
.pix-code{
  margin-top:8px;
  border:1px solid var(--gold);
  border-radius:10px;
  padding:12px;
  color:#fff;
  font-size:12px;
  line-height:1.45;
  word-break:break-all;
  max-height:145px;
  overflow:auto;
}
.copy{width:100%;margin-top:10px}
.status{min-height:22px;text-align:center;color:#7ff0b5;font-weight:800;margin-top:9px}
.thanks{
  text-align:center;
  border:2px solid var(--gold);
  border-radius:18px;
  padding:20px;
}
.thanks-title{font-size:27px;color:var(--gold2);font-weight:900}
.thanks-text{font-size:17px;line-height:1.5;margin-top:8px}
.values{color:var(--gold2);font-weight:900;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:13px;padding-top:14px}
@media(max-width:720px){
  .products{grid-template-columns:1fr}
  .product{min-height:150px}
  .product-icon{font-size:48px;display:inline-block;margin-right:10px}
  .product-name{display:inline-block}
  .product-price{font-size:23px}
  .confirm-row{grid-template-columns:1fr}
  .payment-grid{grid-template-columns:1fr}
  .buttons{grid-template-columns:1fr}
}
</style>
</head>
